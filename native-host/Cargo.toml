[package]
name = "fursoy-native-host"
version = "0.5.9"
edition = "2024"
publish = false

[lib]
name = "fursoy_native_host"
path = "src/lib.rs"

[[bin]]
name = "fursoy-vault-host"
path = "src/bin/fursoy-vault-host.rs"

[dependencies]
aes-gcm = "0.10.3"
psl = "2.1.219"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = { version = "1.9.0", features = ["derive"] }

# Velopack is the Windows companion installer/updater, and the windows crate is the whole Win32
# surface. Both are target-gated so a Linux build neither pulls them nor needs a stand-in.
[target.'cfg(windows)'.dependencies]
velopack = "1.2.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
getrandom = "0.3"
libc = "0.2"
tss-esapi = "7"
p256 = { version = "0.13", features = ["ecdsa"] }

[features]
# Development only: lets the Linux KEK talk to a software TPM simulator instead of a real device.
# Never enable it for a build anyone else runs — the whole point of the KEK is that the private
# half is held by hardware, and a simulator gives that guarantee up while still looking like it
# works. Release builds must not pass --features.
tpm-simulator = []
