name: publish-release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  actions: read
  checks: write
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-host
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned Velopack CLI
        run: dotnet tool install --tool-path native-host/target/vpk-tool vpk --version 1.2.0

      - name: Validate tag and project versions
        id: version
        shell: pwsh
        run: |
          & git fetch --force origin "refs/tags/$($env:GITHUB_REF_NAME):refs/tags/$($env:GITHUB_REF_NAME)" "refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the release tag and origin/main for validation." }

          $tagType = (& git cat-file -t $env:GITHUB_REF_NAME).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagType -ne "tag") {
            throw "$env:GITHUB_REF_NAME must be an annotated tag so its message can become the release notes."
          }
          & git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tags must point to a commit contained in origin/main." }

          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $extensionVersion = (Get-Content extension/package.json -Raw | ConvertFrom-Json).version
          $manifestVersion = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          $nativeVersion = (& cargo metadata --manifest-path native-host/Cargo.toml --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $versions = @(@($extensionVersion, $manifestVersion, $nativeVersion) | Select-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -ne $tagVersion) {
            throw "Tag v$tagVersion does not match extension/package.json ($extensionVersion), extension/manifest.json ($manifestVersion), and native-host/Cargo.toml ($nativeVersion)."
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT
          "extension_zip=extension/target/fursoy-vault-extension-v$tagVersion.zip" >> $env:GITHUB_OUTPUT
          "extension_hash=extension/target/fursoy-vault-extension-v$tagVersion.zip.sha256" >> $env:GITHUB_OUTPUT

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Extension dependency audit
        working-directory: extension
        run: npm audit --audit-level=high
      - name: Extension tests and package
        working-directory: extension
        run: npm run package
      - name: Verify deterministic extension package
        shell: pwsh
        run: |
          $package = "${{ steps.version.outputs.extension_zip }}"
          $first = (Get-FileHash $package -Algorithm SHA256).Hash
          Push-Location extension
          try { node scripts/package.mjs } finally { Pop-Location }
          $second = (Get-FileHash $package -Algorithm SHA256).Hash
          if ($first -ne $second) { throw "Extension package is not deterministic" }

      - name: Rust format
        working-directory: native-host
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: native-host
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        working-directory: native-host
        run: cargo test --release --locked
      - name: Native Messaging acceptance
        shell: pwsh
        run: ./tests/acceptance/run-windows.ps1
      - name: Rust dependency audit
        uses: rustsec/audit-check@v2
        with:
          working-directory: native-host
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unsigned companion installer and update feed
        shell: pwsh
        working-directory: native-host
        run: ./install/package-release.ps1 -VpkCommand (Resolve-Path ./target/vpk-tool/vpk.exe).Path

      - name: Assemble unsigned release assets
        shell: pwsh
        run: |
          $companionRoot = "native-host/target/velopack"
          $setup = Join-Path $companionRoot "FURSOY-Vault-Setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "The unsigned companion Setup.exe was not produced." }
          if (-not (Test-Path -LiteralPath (Join-Path $companionRoot "releases.win.json"))) { throw "The Velopack update feed was not produced." }

          $releaseRoot = "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          Get-ChildItem -LiteralPath $companionRoot -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $releaseRoot
          }
          Copy-Item -LiteralPath "${{ steps.version.outputs.extension_zip }}" -Destination $releaseRoot
          Copy-Item -LiteralPath "${{ steps.version.outputs.extension_hash }}" -Destination $releaseRoot

          $companionHash = (Get-FileHash (Join-Path $releaseRoot "FURSOY-Vault-Setup.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $releaseRoot "FURSOY-Vault-Setup.exe.sha256"),
            "$companionHash  FURSOY-Vault-Setup.exe`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          if-no-files-found: error
          path: release-assets/*

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath "release-assets" -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No release assets were assembled." }

          $tagNotes = (& git for-each-ref --format="%(contents)" "refs/tags/$env:GITHUB_REF_NAME") -join "`n"
          if ([string]::IsNullOrWhiteSpace($tagNotes)) { throw "The annotated tag has no release notes." }
          $policyUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_REF_NAME/CODE_SIGNING_POLICY.md"

          $releaseNotes = @"
          $tagNotes

          ## Windows publisher notice

          The Windows companion installer is currently unsigned and may appear as **Unknown publisher**. Verify the published SHA-256 checksum before installation. See the [project code signing policy]($policyUrl) for the current status and verification guidance.
          "@
          [System.IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP "release-notes.md"),
            $releaseNotes,
            [System.Text.UTF8Encoding]::new($false)
          )

          gh release create "$env:GITHUB_REF_NAME" `
            --verify-tag `
            --latest `
            --title "FURSOY Vault $env:GITHUB_REF_NAME" `
            --notes-file (Join-Path $env:RUNNER_TEMP "release-notes.md") `
            @assets
